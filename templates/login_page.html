<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        /* Минималистичный стиль */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1a1a1a;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 360px;
        }

        h2 { text-align: center; margin-bottom: 24px; font-weight: 600; }

        .form-group { margin-bottom: 16px; }
        
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #666; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border 0.2s;
        }
        
        input:focus { outline: none; border-color: #333; }

        /* Кнопки */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login {
            background-color: #111;
            color: #fff;
        }
        .btn-login:hover { background-color: #000; }

        .divider {
            text-align: center;
            margin: 20px 0;
            font-size: 13px;
            color: #999;
            position: relative;
        }
        .divider::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0;
            border-top: 1px solid #eee; z-index: 1;
        }
        .divider span {
            background: #fff; padding: 0 10px; position: relative; z-index: 2;
        }

        .btn-register {
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn-register:hover { background-color: #f9f9f9; border-color: #ccc; }

    </style>
</head>
<body>

    <div class="container">
        <h2>Вход</h2>
        
        <!-- Форма входа -->
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" placeholder="••••••" required>
            </div>
            
            <button type="submit" class="btn btn-login">Войти</button>
        </form>

        <div class="divider"><span>или</span></div>

        <!-- Кнопка регистрации: Смена URL прямо в HTML через onclick -->
        <button type="button" class="btn btn-register" onclick="window.location.href='registration'">
            Регистрация
        </button>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Отменяем стандартную отправку формы
            
            // Здесь можно добавить проверку пароля
            // ...
            
            // СМЕНА URL ДЛЯ ВХОДА (перенаправление на главную страницу)
            // Замените 'dashboard.html' на адрес вашей страницы
            window.location.href = 'dashboard.html';
        });
    </script>

</body>
</html>
