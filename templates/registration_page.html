<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        /* Тот же минималистичный стиль */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* min-height чтобы форма не обрезалась на маленьких экранах */
            padding: 20px;
            color: #1a1a1a;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 360px;
        }

        h2 { text-align: center; margin-bottom: 24px; font-weight: 600; }

        .form-group { margin-bottom: 16px; }
        
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #666; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border 0.2s;
        }
        
        input:focus { outline: none; border-color: #333; }

        /* Кнопки */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-register {
            background-color: #111;
            color: #fff;
        }
        .btn-register:hover { background-color: #000; }

        .divider {
            text-align: center;
            margin: 20px 0;
            font-size: 13px;
            color: #999;
            position: relative;
        }
        .divider::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0;
            border-top: 1px solid #eee; z-index: 1;
        }
        .divider span {
            background: #fff; padding: 0 10px; position: relative; z-index: 2;
        }

        .btn-login {
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn-login:hover { background-color: #f9f9f9; border-color: #ccc; }

    </style>
</head>
<body>

    <div class="container">
        <h2>Новый аккаунт</h2>
        
        <form action="/register_user" id="regForm" method="post">
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" placeholder="Иван Иванов" id='name'required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="email@example.com" id='mail' required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="pass1" placeholder="••••••" required>
            </div>
            <div class="form-group">
                <label>Повторите пароль</label>
                <input type="password" id="pass2" placeholder="••••••" required>
            </div>
            
            <button type="submit" class="btn btn-register">Создать аккаунт</button>
        </form>

        <div class="divider"><span>Уже есть аккаунт?</span></div>

        <!-- Кнопка назад к входу: Убедитесь, что ваш файл входа называется index.html или login.html -->
        <!-- Я написал 'index.html', замените на название вашего первого файла, если нужно -->
        <button type="button" class="btn btn-login" onclick="window.location.href='/'">
            Войти
        </button>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;

            // Простая проверка совпадения паролей
            if(p1 !== p2) {
                alert('Пароли не совпадают!');
                return;
            }

            // Имитация успешной регистрации -> переход в личный кабинет
            // В реальности здесь была бы отправка данных на сервер
            //alert('Регистрация успешна!');
           // window.location.href = 'dashboard.html';
        });
    </script>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../static/script.js" ></script>
</html>
